<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrokerOne — вход сотрудника</title>
<style>body{font:16px system-ui;background:#0c1724;color:#edf5ff;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(420px,90vw);padding:32px;background:#14263a;border:1px solid #34516a;border-radius:18px}h1{margin-top:0}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font:inherit}input{background:#edf5ff;border:0}button{margin-top:22px;background:#40b8c9;border:0;color:#09202d;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#message{min-height:2em;overflow-wrap:anywhere}small{color:#b4c7d6}</style></head>
<body><main><h1>BROKERONE</h1><p>Вход сотрудника агентства</p><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Войти</button></form><p id="message" role="status" aria-live="polite"></p><small>Доступ предоставляется только сотрудникам, назначенным в офис. Данные не сохраняются в браузере.</small></main>
<script type="module">
const auth='https://ep-little-shape-bavefhfl.neonauth.c-8.eu-central-1.aws.neon.tech/neondb/auth';
const form=document.querySelector('#login'),msg=document.querySelector('#message'),button=document.querySelector('#submit');
async function request(path,options={}){const response=await fetch(auth+path,{credentials:'include',...options});const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body.message||body.error||'Ошибка авторизации');return body}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;msg.textContent='Проверяем учётную запись…';try{await request('/sign-in/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value})});const tokenResult=await request('/token');if(!tokenResult.token)throw Error('Сервер авторизации не выдал JWT');const response=await fetch('/api/v1/me',{headers:{Authorization:'Bearer '+tokenResult.token},cache:'no-store'});if(!response.ok){msg.textContent=response.status===403?'Учётная запись подтверждена, но доступ к офису не назначен.':response.status===401?'JWT не принят API. Требуется проверка конфигурации токена.':'Ошибка проверки доступа к офису ('+response.status+').';return}const data=await response.json();msg.textContent='Вход подтверждён. Доступ к офису: '+(data.user?.office_id||'назначен')+'. Подключение интерфейса CRM к API — следующий этап.';}catch(error){msg.textContent=error.message||'Ошибка входа'}finally{button.disabled=false;document.querySelector('#password').value=''}});
</script></body></html>
