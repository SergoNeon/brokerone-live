<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrokerOne | Lead Command</title><link rel="stylesheet" href="./style.css"><style>.shell{max-width:1450px;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.back{color:#7df5d5;text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.filters input{flex:1;min-width:180px}.filters select{min-width:140px}.leads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lead{background:linear-gradient(145deg,#172a42,#101e32);border:1px solid #304861;border-radius:18px;padding:20px}.leadtop{display:flex;justify-content:space-between;gap:12px}.lead h3{margin:0 0 6px;font-size:19px}.lead .muted{font-size:13px}.score{font-size:24px;font-weight:800;color:#77edce}.score small{display:block;font-size:10px;letter-spacing:1px;color:#9bb4ce}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.chip{font-size:11px;padding:6px 9px;border-radius:30px;background:#203850;color:#c2d9ee}.chip.warn{background:#573a31;color:#ffbd99}.lead-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.lead-actions button,.lead-actions a{border:1px solid #3a5b72;border-radius:10px;background:#203b51;color:#e5f8ff;text-decoration:none;padding:9px 12px;cursor:pointer;font-size:12px}.lead-actions .wa{background:#1b5147;color:#a3ffdc}.modal{display:none}.modal.visible{display:grid}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog{width:min(620px,100%)}.dialog textarea{width:100%;min-height:75px;background:#15263e;color:#fff;border:1px solid #35506d;border-radius:10px;padding:10px}.dialog label{margin-top:8px}.toolbar-actions{display:flex;gap:8px}.empty{grid-column:1/-1}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.leads{grid-template-columns:1fr}}@media(max-width:520px){.fieldrow{grid-template-columns:1fr}.metrics .number{font-size:26px}}</style></head><body><main class="shell"><div class="topline"><div><a class="back" href="./index.html">← BrokerOne</a><div class="kicker" style="margin-top:22px">LEAD COMMAND CENTER</div><h1 id="title"></h1><p id="subtitle" class="muted"></p></div><div class="toolbar-actions"><select id="lang"><option value="ru">Русский</option><option value="he">עברית</option><option value="en">English</option></select><button class="primary" id="add"></button></div></div><div class="metrics" id="metrics"></div><div class="filters"><input id="query" type="search"><select id="filter"><option value="all"></option><option value="overdue"></option><option value="today"></option><option value="hot"></option></select><button class="secondary" id="export"></button></div><div class="leads" id="leads"></div><p class="muted" id="notice" style="font-size:12px;margin-top:22px"></p></main><div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="formTitle"></h2><button class="secondary" id="close">✕</button></div><form id="leadForm"><div class="fieldrow"><label><span data-label="name"></span><input name="name" required maxlength="120"></label><label><span data-label="phone"></span><input name="phone" type="tel" maxlength="30"></label></div><div class="fieldrow"><label><span data-label="source"></span><select name="source"><option value="website">Website</option><option value="yad2">Yad2</option><option value="madlan">Madlan</option><option value="whatsapp">WhatsApp</option><option value="referral">Referral</option><option value="other">Other</option></select></label><label><span data-label="stage"></span><select name="stage"><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="won">Won</option><option value="lost">Lost</option></select></label></div><div class="fieldrow"><label><span data-label="budget"></span><input name="budget" type="number" min="0" step="1000"></label><label><span data-label="city"></span><input name="city" maxlength="100"></label></div><div class="fieldrow"><label><span data-label="agent"></span><select name="agent" id="agent"><option value=""></option></select></label><label><span data-label="followup"></span><input name="followup" type="date"></label></div><label><span data-label="notes"></span><textarea name="notes" maxlength="2000"></textarea></label><button class="primary" type="submit" id="save"></button></form></div></div><script src="./leads.js"></script></body></html>
