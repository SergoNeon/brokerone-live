<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrokerCRM | Property Collection</title><link rel="stylesheet" href="./style.css"><style>.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}.back{color:#7eeed2;text-decoration:none}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.filters input{flex:1;min-width:170px}.filters select{min-width:140px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.property{background:#13233a;border:1px solid #304763;border-radius:20px;overflow:hidden}.art{height:190px;position:relative;background:linear-gradient(145deg,#224f69,#0c263e);display:grid;place-items:center;overflow:hidden}.art:before{content:'';position:absolute;width:60%;height:65%;border:3px solid #a7d6d84f;transform:skewY(-9deg) rotate(-8deg);box-shadow:25px 20px 0 #9bcae218,-25px -15px 0 #9bcae218}.art:after{content:'⌂';font-size:95px;color:#b9ecf4b8;position:relative}.art[data-i="1"]{background:linear-gradient(135deg,#31535a,#153e46)}.art[data-i="2"]{background:linear-gradient(135deg,#494e72,#172b4c)}.art[data-i="3"]{background:linear-gradient(135deg,#605142,#2c3046)}.details{padding:21px}.details h2{margin:8px 0;font-size:19px}.price{font-size:25px;font-weight:800;color:#75e6cf}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.meta span{border:1px solid #3b5570;background:#1b314b;padding:7px 10px;border-radius:9px;color:#c3d7ec;font-size:12px}.tag{position:absolute;top:15px;left:15px;z-index:1;background:#d1ffec;color:#143f38;padding:7px 12px;border-radius:30px;font-size:11px;font-weight:800}.empty{grid-column:1/-1}.footer{color:#8fa7c1;margin-top:25px;font-size:13px}@media(max-width:1000px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.gallery{grid-template-columns:1fr}.art{height:210px}}</style></head><body><main style="max-width:1450px;margin:auto"><div class="top"><div><a class="back" href="./index.html">← BrokerCRM</a><div class="kicker" style="margin-top:25px">THE PROPERTY COLLECTION</div><h1 id="title"></h1><p id="subtitle" class="muted"></p></div><select id="lang" style="width:auto"><option value="ru">Русский</option><option value="he">עברית</option><option value="en">English</option></select></div><div class="filters"><input id="query" type="search"><select id="status"><option value="all"></option><option value="open">Open</option><option value="closed">Closed</option></select><select id="sort"><option value="new"></option><option value="low"></option><option value="high"></option></select></div><div class="section-heading"><h2 id="results"></h2><span id="count" class="pill"></span></div><div class="gallery" id="gallery"></div><p id="foot" class="footer"></p></main><script src="./catalog.js"></script></body></html>
