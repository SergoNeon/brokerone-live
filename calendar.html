<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrokerCRM | Viewing Calendar</title><link rel="stylesheet" href="./style.css"><style>.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.back{color:#76f2d5;text-decoration:none}.toolbar{display:flex;gap:12px;flex-wrap:wrap}.toolbar select{min-width:160px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin-top:24px}.day{background:#15253c;border:1px solid #314962;border-radius:14px;min-height:115px;padding:12px}.day.today{border-color:#6ee4ca}.day.off{opacity:.4}.date{font-size:14px;color:#a8bdd8;font-weight:800}.event{background:#24545b;border-inline-start:3px solid #6af0cc;color:#e5fff7;padding:7px;border-radius:7px;margin-top:7px;font-size:11px;overflow-wrap:anywhere}.weekday{color:#8fa4bf;font-size:12px;text-align:center;text-transform:uppercase}.upcoming{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:20px}.upcoming .panel{margin:0}.nav{display:flex;align-items:center;gap:8px}.nav button{background:#1d314c;border:1px solid #3b5878;color:white;border-radius:10px;padding:10px;cursor:pointer}.empty{padding:16px}.event strong{display:block}@media(max-width:800px){.calendar{gap:4px}.day{min-height:85px;padding:5px;border-radius:8px}.date{font-size:11px}.event{font-size:9px;padding:4px}.weekday{font-size:9px}}</style></head><body><main style="max-width:1500px;margin:auto"><header><div><a class="back" href="./index.html">← BrokerCRM</a><div class="kicker" style="margin-top:24px">VIEWING OPERATIONS</div><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><select id="lang" style="width:auto"><option value="ru">Русский</option><option value="he">עברית</option><option value="en">English</option></select></header><div class="head" style="margin-top:26px"><div class="nav"><button id="prev">‹</button><h2 id="month" style="m
