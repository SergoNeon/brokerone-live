nt:center;min-height:46px;font-weight:650;font-size:14px}.actions button{background:#0e746a;border-color:#239889;color:#fff}.actions button:hover{background:#119183}.actions label:hover{border-color:#6ad2c2;background:#235265}.warning{border-radius:8px;font-size:13px;line-height:1.6}.status{font-size:13px;min-height:auto}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.meta>span{padding:10px 14px;background:#1b3047;border:1px solid #324c64;border-radius:9px;color:#bdd0df;font-size:13px}.head select{background:#172c42;color:#fff;border:1px solid #405873;border-radius:10px;padding:12px}@media(max-width:760px){.wrap{padding:24px 16px 55px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.panel2{padding:22px}.actions button,.actions label{width:100%}}@media(max-width:390px){.tiles{grid-template-columns:1fr 1fr}.tile{padding:14px}} </style></head><body><main class="wrap"><div class="head"><div><a class="back" href="./index.html">← BrokerOne</a><div class="kicker" style="margin-top:23px">OFFICE DATA CONTROL</div><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><select id="lang"><option value="ru">Русский</option><option value="he">עברית</option><option value="en">English</option></select></div><div class="tiles" id="tiles"></div><section class="panel2"><h2 id="backupTitle"></h2><p class="small" id="backupDesc"></p><div class="meta"><span id="storageMode"></span><span id="lastBackup"></span></div><div class="actions"><button id="download"></button><label for="file" id="uploadLabel"></label><input id="file" type="file" accept=".json,application/json"></div><div class="warning" id="warning"></div><div class="status" id="status" role="status" aria-live="polite"></div></section><section class="panel2"><h2 id="privacyTitle"></h2><p class="small" id="privacyDesc"></p></section><script src="./records.js?v=13"></script></main></body></html>
